<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yubisashi-rails dev</title>
  <script type="module" src="/src/yubisashi-rails.ts"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f8fafc;
      color: #1e293b;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 24px; }
    .user-list { display: flex; flex-direction: column; gap: 16px; }
    .user-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #c7d2fe;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .user-info h3 { margin: 0 0 4px; font-size: 16px; }
    .user-info p { margin: 0; font-size: 13px; color: #64748b; }
    nav { background: #fff; padding: 12px 20px; border-bottom: 1px solid #e2e8f0; margin: -20px -20px 24px; }
    nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 16px; }
    nav a { text-decoration: none; color: #475569; font-size: 14px; font-weight: 500; }
    nav a.active { color: #6366f1; }
    .sidebar { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-top: 24px; }
    .sidebar h2 { font-size: 16px; margin: 0 0 12px; }
    .tag { display: inline-block; padding: 4px 10px; background: #eef2ff; color: #4338ca; border-radius: 6px; font-size: 12px; margin: 2px; }
  </style>
</head>
<body>
  <!-- BEGIN /app/views/layouts/application.html.erb -->

  <!-- BEGIN /app/views/shared/_header.html.erb -->
  <nav class="main-nav" data-controller="navigation">
    <ul>
      <li><a href="/" class="nav-link active">Home</a></li>
      <li><a href="/users" class="nav-link">Users</a></li>
      <li><a href="/settings" class="nav-link">Settings</a></li>
    </ul>
  </nav>
  <!-- END /app/views/shared/_header.html.erb -->

  <div class="container">
    <!-- BEGIN /app/views/users/index.html.erb -->
    <h1>Users</h1>
    <div class="user-list">

      <!-- BEGIN /app/views/users/_card.html.erb -->
      <div class="user-card" data-testid="user-card-1">
        <!-- BEGIN /app/views/users/_avatar.html.erb -->
        <div class="avatar" data-testid="user-avatar">T</div>
        <!-- END /app/views/users/_avatar.html.erb -->
        <div class="user-info">
          <h3>Tanaka Taro</h3>
          <p>tanaka@example.com</p>
        </div>
      </div>
      <!-- END /app/views/users/_card.html.erb -->

      <!-- BEGIN /app/views/users/_card.html.erb -->
      <div class="user-card" data-testid="user-card-2">
        <!-- BEGIN /app/views/users/_avatar.html.erb -->
        <div class="avatar" data-testid="user-avatar">S</div>
        <!-- END /app/views/users/_avatar.html.erb -->
        <div class="user-info">
          <h3>Suzuki Hanako</h3>
          <p>suzuki@example.com</p>
        </div>
      </div>
      <!-- END /app/views/users/_card.html.erb -->

      <!-- BEGIN /app/views/users/_card.html.erb -->
      <div class="user-card" data-testid="user-card-3">
        <!-- BEGIN /app/views/users/_avatar.html.erb -->
        <div class="avatar" data-testid="user-avatar">Y</div>
        <!-- END /app/views/users/_avatar.html.erb -->
        <div class="user-info">
          <h3>Yamada Jiro</h3>
          <p>yamada@example.com</p>
        </div>
      </div>
      <!-- END /app/views/users/_card.html.erb -->

    </div>
    <!-- END /app/views/users/index.html.erb -->

    <!-- BEGIN /app/views/shared/_sidebar.html.erb -->
    <div class="sidebar">
      <h2>Tags</h2>
      <div>
        <span class="tag">Ruby</span>
        <span class="tag">Rails</span>
        <span class="tag">TypeScript</span>
        <span class="tag">Web Components</span>
      </div>
    </div>
    <!-- END /app/views/shared/_sidebar.html.erb -->
  </div>

  <!-- END /app/views/layouts/application.html.erb -->

  <yubisashi-rails
    root=""
    combo-key="command-shift-a"
    position="bottom-right"
  ></yubisashi-rails>
</body>
</html>
